apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cert-erikak
  namespace: gateway
spec:
  dnsNames:
    - "*.erikak.no"
    - erikak.no
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: cloudflare-cluster-issuer
  secretName: cert-erikak
  usages:
    - digital signature
    - key encipherment