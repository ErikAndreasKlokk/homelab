# Tailscale OAuth client for the operator (Devices:Core + Auth Keys = Write,
# tagged tag:k8s-operator). To rotate: recreate the client, then re-run
#   kubectl create secret generic operator-oauth \
#     --from-literal=client_id='ID' --from-literal=client_secret='SECRET' \
#     -n tailscale --dry-run=client -o yaml | kubeseal -o yaml \
#     > setup-homelab/tailscale/operator-oauth-sealed-secret.yaml
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: operator-oauth
  namespace: tailscale
spec:
  encryptedData:
    client_id: 
    client_secret: 
  template:
    metadata:
      name: operator-oauth
      namespace: tailscale
