# Tailscale OAuth client for the operator. Create the client in the Tailscale
# admin console (Settings → OAuth clients) with scopes:
#   - Devices  → Core         (write)
#   - Auth Keys                (write)
# and tag it with a tag the operator can manage (e.g. tag:k8s-operator).
#
# Then seal it (never commit the plaintext):
#   kubectl create secret generic operator-oauth \
#     --from-literal=client_id='TS-CLIENT-ID' \
#     --from-literal=client_secret='TS-CLIENT-SECRET' \
#     -n tailscale --dry-run=client -o yaml \
#     | kubeseal -o yaml \
#     > setup-homelab/tailscale/operator-oauth-sealed-secret.yaml
#
# This placeholder has empty encryptedData; replace it with the sealed output.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: operator-oauth
  namespace: tailscale
spec:
  encryptedData: {}
  template:
    metadata:
      name: operator-oauth
      namespace: tailscale
