apiVersion: v1
kind: Namespace
metadata:
  name: media
  labels:
    # gluetun needs NET_ADMIN + a hostPath mount of /dev/net/tun to build the
    # WireGuard tunnel. Talos enforces PodSecurity "baseline" by default, which
    # forbids both, so this namespace opts up to "privileged".
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
