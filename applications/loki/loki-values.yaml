deploymentMode: SingleBinary

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  storage:
    type: filesystem

  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

  limits_config:
    retention_period: 336h   # 14 days

  compactor:
    retention_enabled: true
    working_directory: /var/loki/compactor
    delete_request_store: filesystem

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: local-path
    size: 20Gi

# Disable distributed-mode components (not needed in SingleBinary)
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# Disable caches (unnecessary overhead for homelab scale)
chunksCache:
  enabled: false
resultsCache:
  enabled: false

# Keep the gateway (nginx reverse proxy — used by Alloy and Grafana)
gateway:
  enabled: true

# Disable Helm test hook
test:
  enabled: false
