apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ns.yaml

helmCharts:
  - name: loki
    repo: https://grafana.github.io/helm-charts
    version: 6.6.2
    releaseName: loki
    namespace: loki
    valuesFile: loki-values.yaml

  - name: alloy
    repo: https://grafana.github.io/helm-charts
    version: 0.9.2
    releaseName: alloy
    namespace: loki
    valuesFile: alloy-values.yaml
