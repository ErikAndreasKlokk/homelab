apiVersion: v1
kind: ServiceAccount
metadata:
  name: playit-operator
  namespace: playit-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: playit-operator
rules:
  - apiGroups: ["playit-operator.io"]
    resources: ["playittunnels"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["playit-operator.io"]
    resources: ["playittunnels/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["playit-operator.io"]
    resources: ["playittunnels/finalizers"]
    verbs: ["update"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: playit-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: playit-operator
subjects:
  - kind: ServiceAccount
    name: playit-operator
    namespace: playit-operator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: playit-operator
  namespace: playit-operator
  labels:
    app: playit-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: playit-operator
  template:
    metadata:
      labels:
        app: playit-operator
    spec:
      serviceAccountName: playit-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: ghcr.io/erikandreasklokk/playit-operator:main
          imagePullPolicy: Always
          env:
            - name: PLAYIT_PROVIDER
              value: "playit"
            - name: PLAYIT_AGENT_KEY
              valueFrom:
                secretKeyRef:
                  name: playit-agent-key
                  key: secret-key
            - name: RUST_LOG
              value: "info"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
