# A self-managed playit agent. Its secret (a self-managed agent key, claimed via
# `cargo run --bin claim` in the playit-operator repo) is used both here (the
# data plane — forwarding traffic) and by the operator (the control plane —
# creating/managing tunnels via the playit V1 API).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: playit-agent-selfmanaged
  namespace: playit-operator
  labels:
    app: playit-agent-selfmanaged
spec:
  replicas: 1
  selector:
    matchLabels:
      app: playit-agent-selfmanaged
  template:
    metadata:
      labels:
        app: playit-agent-selfmanaged
    spec:
      containers:
        - name: agent
          image: ghcr.io/playit-cloud/playit-agent:latest
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: playit-agent-key
                  key: secret-key
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
