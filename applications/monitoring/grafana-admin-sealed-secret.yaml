# Seal this before committing.
#
# Step 1 — create the plain secret (never commit this):
#   wsl -- bash -lc "kubectl create secret generic grafana-admin-secret \
#     --from-literal=admin-user=admin \
#     --from-literal=admin-password=CHANGEME \
#     -n monitoring --dry-run=client -o yaml > /tmp/grafana-secret.yaml"
#
# Step 2 — seal it:
#   wsl -- bash -lc "kubeseal -f /tmp/grafana-secret.yaml -w /tmp/grafana-admin-sealed-secret.yaml"
#
# Step 3 — copy to this file:
#   Copy-Item "\\wsl$\Ubuntu-24.04\tmp\grafana-admin-sealed-secret.yaml" `
#     "E:\Koder\homelab\applications\monitoring\grafana-admin-sealed-secret.yaml"
#
# Step 4 — discard the plain secret:
#   wsl -- bash -lc "rm /tmp/grafana-secret.yaml"
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: grafana-admin-secret
  namespace: monitoring
spec:
  encryptedData: {}
  template:
    metadata:
      name: grafana-admin-secret
      namespace: monitoring
