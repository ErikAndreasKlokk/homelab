# Seal this before committing.
# The secret must contain a key "alertmanager.yaml" with the full AlertManager config.
# Replace DISCORD_WEBHOOK_URL with your actual Discord webhook URL.
#
# Step 1 — write the config to a temp file:
#   wsl -- bash -lc "cat > /tmp/am-config.yaml << 'EOF'
# global:
#   resolve_timeout: 5m
# route:
#   group_by: [namespace, alertname]
#   group_wait: 30s
#   group_interval: 5m
#   repeat_interval: 12h
#   receiver: discord
#   routes:
#     - receiver: 'null'
#       matchers:
#         - alertname = InfoInhibitor
#     - receiver: discord
#       matchers:
#         - severity =~ 'warning|critical'
# receivers:
#   - name: 'null'
#   - name: discord
#     discord_configs:
#       - webhook_url: DISCORD_WEBHOOK_URL
#         title: '{{ .GroupLabels.alertname }} [{{ .Status | toUpper }}]'
#         message: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}'
# inhibit_rules:
#   - source_matchers:
#       - severity = critical
#     target_matchers:
#       - severity = warning
#     equal: [namespace, alertname]
# EOF"
#
# Step 2 — create and seal the secret:
#   wsl -- bash -lc "kubectl create secret generic alertmanager-discord-secret \
#     --from-file=alertmanager.yaml=/tmp/am-config.yaml \
#     -n monitoring --dry-run=client -o yaml | \
#     kubeseal -o yaml > /tmp/alertmanager-discord-sealed-secret.yaml && \
#     rm /tmp/am-config.yaml"
#
# Step 3 — copy to this file:
#   Copy-Item "\\wsl$\Ubuntu-24.04\tmp\alertmanager-discord-sealed-secret.yaml" `
#     "E:\Koder\homelab\applications\monitoring\alertmanager-discord-sealed-secret.yaml"
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: alertmanager-discord-secret
  namespace: monitoring
spec:
  encryptedData: {}
  template:
    metadata:
      name: alertmanager-discord-secret
      namespace: monitoring
