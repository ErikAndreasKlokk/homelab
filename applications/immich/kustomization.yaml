apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: immich

resources:
  - ns.yaml
  - http-route.yaml
  - pvc.yaml
  - svc.yaml
  - sealed-secret.yaml
  - postgresql-sealed-secret.yaml
  - postgresql-cluster.yaml

helmCharts:
  - name: immich
    repo: https://immich-app.github.io/immich-charts
    version: 0.10.3
    releaseName: immich
    namespace: immich
    valuesFile: values.yaml