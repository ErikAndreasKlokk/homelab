apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: immich

resources:
  - ns.yaml
  - http-route.yaml
  - pvc.yaml
  - svc.yaml
  - immich-db-secret.yaml
  - postgresql-password.yaml

helmCharts:
  - name: postgresql
    repo: https://charts.bitnami.com/bitnami
    version: 16.2.4
    releaseName: immich-postgresql
    namespace: immich
    valuesInline:
      auth:
        username: immich
        database: immich
        existingSecret: immich-postgresql-secret
        secretKeys:
          adminPasswordKey: postgres-password
          userPasswordKey: password
      primary:
        persistence:
          enabled: true
          size: 20Gi
          storageClass: local-path
  
  - name: immich
    repo: https://immich-app.github.io/immich-charts
    version: 0.10.3
    releaseName: immich
    namespace: immich
    valuesFile: values.yaml