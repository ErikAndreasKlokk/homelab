apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ns.yaml
  - http-route.yaml
  - pvc.yaml
  - svc.yaml
  - immich-db-secret.yaml

helmCharts:
  - name: immich
    repo: https://immich-app.github.io/immich-charts
    version: 0.10.3
    releaseName: "immich"
    namespace: immich
    valuesFile: values.yaml