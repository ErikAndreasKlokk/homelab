controllers:
  main:
    containers:
      main:
        image:
          tag: v2.3.1
        env:
          DB_HOSTNAME: 'immich-postgres-rw'
        
        envFrom:
          - secretRef:
              name: immich-postgresql-secret

immich:
  persistence:
    library:
      existingClaim: immich-data

valkey:
  enabled: true