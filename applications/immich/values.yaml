immich:
  persistence:
    library:
      existingClaim: immich-data

valkey:
  enabled: true

env:
  DB_HOSTNAME: "immich-postgres-rw.immich.svc.cluster.local"
  DB_PORT: "5432"
  DB_USERNAME: "immich"
  DB_DATABASE_NAME: "immich"
  DB_PASSWORD:
    valueFrom:
      secretKeyRef:
        name: immich-db-secret
        key: DB_PASSWORD