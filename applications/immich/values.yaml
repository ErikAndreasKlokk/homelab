controllers:
  main:
    containers:
      main:
        env:
          DB_HOSTNAME: 'immich-postgresql-rw'
          DB_USERNAME: 
            valueFrom:
              secretKeyRef:
                key: username
                name: immich-postgresql-secret
          DB_PASSWORD: 
            valueFrom:
              secretKeyRef:
                key: password
                name: immich-postgresql-secret

envFrom:
  - secretRef:
      name: immich-postgresql-secret

immich:
  persistence:
    library:
      existingClaim: immich-data

valkey:
  enabled: true

# Face/object recognition and smart search on the RTX 2080
# (applications/nvidia-device-plugin). The -cuda tag must match the server
# version (chart default tag, currently v2.0.0).
machine-learning:
  controllers:
    main:
      pod:
        runtimeClassName: nvidia
      containers:
        main:
          image:
            tag: v2.0.0-cuda
          resources:
            limits:
              nvidia.com/gpu: 1