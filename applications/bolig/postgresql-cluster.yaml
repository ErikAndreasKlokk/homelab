apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: bolig-postgresql
  namespace: bolig
spec:
  imageName: ghcr.io/tensorchord/cloudnative-pgvecto.rs:16.5-v0.3.0@sha256:be3f025d79aa1b747817f478e07e71be43236e14d00d8a9eb3914146245035ba
  instances: 1

  postgresql:
    parameters:
      timezone: Europe/Oslo

  managed:
    roles:
      - name: bolig
        superuser: true
        login: true

  bootstrap:
    initdb:
      database: bolig
      owner: bolig
      secret:
        name: bolig-postgresql-secret

  storage:
    size: 5G
    storageClass: local-path

  monitoring:
    enablePodMonitor: true
