# code-server login password, sealed against the cluster's sealed-secrets
# controller. To rotate: re-run the kubectl create secret | kubeseal pipeline
# (see new-homelab-project skill) and replace encryptedData below.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: claude-code-secret
  namespace: claude-code
spec:
  encryptedData:
    code-server-password: 
  template:
    metadata:
      name: claude-code-secret
      namespace: claude-code
