apiVersion: v1
kind: ServiceAccount
metadata:
  name: claude-code
  namespace: claude-code
---
# Read-all + write-workloads. Lets the pod inspect the whole cluster and manage
# app workloads (rollout/restart, logs, exec, seal secrets), but NOT delete
# namespaces or edit cluster RBAC.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: claude-code
rules:
  # Full read across every resource in the cluster.
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # Manage workloads.
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets", "deployments/scale", "statefulsets/scale"]
    verbs: ["create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "configmaps", "services"]
    verbs: ["create", "update", "patch", "delete"]
  # Interactive debugging.
  - apiGroups: [""]
    resources: ["pods/exec", "pods/portforward"]
    verbs: ["create"]
  # Trigger ArgoCD app syncs / inspect Application status.
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: claude-code
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: claude-code
subjects:
  - kind: ServiceAccount
    name: claude-code
    namespace: claude-code
