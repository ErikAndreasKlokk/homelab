apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: claude-code-data
  namespace: claude-code
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      # Holds /home/coder: the workspace repos, node_modules, ~/.claude auth
      # + config, and code-server state. Bump if the checkouts outgrow it.
      storage: 20Gi
