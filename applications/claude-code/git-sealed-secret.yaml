# GitHub token for cloning private repos and pushing from the pod.
# Create a fine-grained PAT (or classic token with `repo` scope) that can read
# and push the ErikAndreasKlokk repos, then seal it (never commit plaintext):
#
#   kubectl create secret generic claude-code-git \
#     --from-literal=github-token='ghp_xxx' \
#     -n claude-code --dry-run=client -o yaml \
#     | kubeseal -o yaml \
#     > applications/claude-code/git-sealed-secret.yaml
#
# (run from the homelab repo root). Until sealed, the pod still starts — the
# GITHUB_TOKEN env is optional — but private clones and pushing won't work.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: claude-code-git
  namespace: claude-code
spec:
  encryptedData: {}
  template:
    metadata:
      name: claude-code-git
      namespace: claude-code
