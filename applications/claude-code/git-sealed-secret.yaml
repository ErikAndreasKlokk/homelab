# GitHub token (fine-grained PAT: Contents RW, Metadata RO, Workflows RW) for
# cloning private repos and pushing from the pod. To rotate: re-run
#   kubectl create secret generic claude-code-git \
#     --from-literal=github-token='NEW' -n claude-code --dry-run=client -o yaml \
#     | kubeseal -o yaml > applications/claude-code/git-sealed-secret.yaml
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: claude-code-git
  namespace: claude-code
spec:
  encryptedData:
    github-token: 
  template:
    metadata:
      name: claude-code-git
      namespace: claude-code
